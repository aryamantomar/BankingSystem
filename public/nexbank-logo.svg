<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Axis Burgundy Gradient -->
    <linearGradient id="nbBurgundyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d0b36" />
      <stop offset="50%" stop-color="#97144d" />
      <stop offset="100%" stop-color="#b81b60" />
    </linearGradient>

    <!-- Ruby / Crimson Dynamic Velocity Gradient -->
    <linearGradient id="nbRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="60%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- 24K Sovereign Gold Gradient -->
    <linearGradient id="nbGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Specular Highlight Sheen -->
    <linearGradient id="nbSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Vector Depth -->
    <filter id="nbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#97144d" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#nbGlow)">
    <!-- Left Foundation Pillar (Rock-Solid Trust & Stability) -->
    <path d="M 18 80 L 18 32 C 18 27 21 23 26 21 L 34 18 C 36 17 38 18.5 38 21 L 38 71 C 38 76 35 80 30 82 L 22 85 C 20 86 18 84.5 18 82 Z" fill="url(#nbBurgundyGrad)" />
    <path d="M 20 33 L 20 78 L 24 76 L 24 31 Z" fill="url(#nbSpecular)" opacity="0.4" />

    <!-- Dynamic Diagonal Nexus Bridge (Cross-border Speed & Connectivity) -->
    <path d="M 32 23 L 68 67 C 71 70 70 75 66 78 L 58 84 C 55 86 51 85 48 82 L 14 40 C 11 37 12 32 16 29 L 24 23 C 27 21 30 21 32 23 Z" fill="url(#nbRubyGrad)" />

    <!-- Right Rising Pillar & Crown Wing (Wealth Creation & Innovation) -->
    <path d="M 62 79 C 62 82 64 83 66 82 L 74 79 C 79 77 82 73 82 68 L 82 29 C 82 24 79 20 74 18 L 66 15 C 64 14 62 16 62 18 L 62 79 Z" fill="url(#nbGoldGrad)" />
    <path d="M 76 21 L 76 66 L 80 64 L 80 23 Z" fill="url(#nbSpecular)" opacity="0.5" />

    <!-- Chevron Crown Crest (Homage to Axis Bank's Triangular Apex) -->
    <path d="M 50 12 L 62 26 L 50 40 L 38 26 Z" fill="url(#nbGoldGrad)" opacity="0.95" />
    <path d="M 50 17 L 57 26 L 50 35 L 43 26 Z" fill="#ffffff" opacity="0.85" />
    <circle cx="50" cy="26" r="2.5" fill="#97144d" />
  </g>
</svg>